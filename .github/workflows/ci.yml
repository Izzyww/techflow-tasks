name: Qualidade TechFlow
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: npm run check
      - name: Executar testes
        run: npm test
